[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nonprofit-backpack"
version = "0.1.0"
description = "Create a Nonprofit Backpack: a minimal OKF v0.2 bundle describing a nonprofit, with provenance."
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.11"
dependencies = [
  "click>=8.1",
  "httpx>=0.27",
  "pyyaml>=6.0",
  "playwright>=1.47",
  "trafilatura>=1.12",
  "beautifulsoup4>=4.12",
]

[project.scripts]
nbp = "nonprofit_backpack.cli:main"

[tool.setuptools.packages.find]
include = ["nonprofit_backpack*"]

[tool.setuptools.package-data]
nonprofit_backpack = ["prompts/*.md"]
